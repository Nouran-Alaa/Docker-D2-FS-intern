services:
  app:
    build: .
    container_name: node-users-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app_network

  mongo:
    image: mongo:6
    container_name: node-users-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  mongo-data:

networks:
  app_network:
    driver: bridge
